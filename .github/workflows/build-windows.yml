name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build single-file EXE with bundled assets
        run: python scripts/build_exe.py
      - name: Upload Windows distribution
        uses: actions/upload-artifact@v4
        with:
          name: ZZZAutoFish-windows-x64
          path: |
            dist/ZZZAutoFish.exe
            dist/ZZZAutoFish.exe.sha256
            dist/README.md
            dist/LICENSE
            dist/NOTICE.md
            dist/docs/**
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ZZZAutoFish-windows-x64
          path: artifact
      - name: Publish tagged release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$env:RELEASE_TAG" --repo "$env:GH_REPO" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:RELEASE_TAG" artifact/ZZZAutoFish.exe artifact/ZZZAutoFish.exe.sha256 --clobber --repo "$env:GH_REPO"
          } else {
            gh release create "$env:RELEASE_TAG" artifact/ZZZAutoFish.exe artifact/ZZZAutoFish.exe.sha256 --verify-tag --generate-notes --repo "$env:GH_REPO"
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release upload failed.' }
